name: Build FNF web and deploy to Pages

# Run it by hand: Actions tab -> "Build FNF web and deploy to Pages" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Change v1 to v2 (etc.) to throw away the saved setup and rebuild it from scratch.
  CACHE_VERSION: v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pulls the official game source plus the assets submodule.
      - name: Get Funkin source and assets
        uses: actions/checkout@v4
        with:
          repository: FunkinCrew/Funkin
          submodules: recursive

      - name: Install Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      # Restore the saved setup (libraries, hxcpp tools, lime.ndll, Font.hx patch).
      # The key changes only when the game's pinned library versions (hmm.json) change.
      - name: Restore saved setup
        id: setup-cache
        uses: actions/cache/restore@v4
        with:
          path: .haxelib
          key: fnf-setup-${{ env.CACHE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Install libraries pinned by the game (hmm.json)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install

      - name: Install system packages needed to compile Lime's native file
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev \
            libvlc-dev libvlccore-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev libxss-dev \
            libudev-dev libdbus-1-dev \
            libpipewire-0.3-dev libsndio-dev libjack-jackd2-dev libibus-1.0-dev libxtst-dev

      - name: Build hxcpp tools (hxcpp comes from git, so it is not pre-built)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Set up Lime
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: yes | haxelib run lime setup || true

      - name: Build Lime's native file (lime.ndll)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild linux
          ls .haxelib/lime/git/ndll

      - name: Patch Lime Font.hx (missing Log import on HTML5)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: |
          F=.haxelib/lime/git/src/lime/text/Font.hx
          echo "--- Log mentions before patch ---"
          grep -n "Log" "$F" | head -20
          sed -i '0,/^package lime.text;/s//package lime.text;\n\nimport lime.utils.Log;/' "$F"
          echo "--- top of file after patch ---"
          head -12 "$F"

      # Saved BEFORE the game build, so a failed game build still keeps this setup.
      - name: Save setup for next time
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .haxelib
          key: fnf-setup-${{ env.CACHE_VERSION }}-${{ hashFiles('hmm.json') }}

      - name: Build HTML5
        run: haxelib run lime build html5 -release

      - name: Show output size
        run: du -sh export/release/html5/bin && ls export/release/html5/bin

      - name: Package site
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/release/html5/bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
